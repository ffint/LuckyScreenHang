name: Build v1.4 experiment
on:
  push:
    branches: [v1.4-userservice]
    paths: ['v14/**', '.github/workflows/build-v14.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Normalize Android 17 SDK path
        run: |
          ls -la "$ANDROID_HOME/platforms"
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release
        working-directory: v14
        run: gradle :app:assembleRelease --stacktrace
      - name: Publish build as base64 for retrieval
        run: |
          APK=$(find v14/app/build/outputs/apk/release -name '*.apk' | head -1)
          base64 "$APK" | tr -d '\n' > v14/LuckyScreenHang-v1.4-exp-unsigned.apk.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v14/LuckyScreenHang-v1.4-exp-unsigned.apk.b64
          git commit -m 'Build v1.4 experimental APK [skip ci]'
          git push
