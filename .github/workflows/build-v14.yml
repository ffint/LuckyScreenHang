name: Build v1.4 experiment
on:
  push:
    branches: [v1.4-userservice]
    paths: ['v14/**', '.github/workflows/build-v14.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Normalize Android 17 SDK path
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release
        working-directory: v14
        run: gradle :app:assembleRelease --stacktrace
      - name: Collect APK
        run: |
          mkdir -p artifact
          cp $(find v14/app/build/outputs/apk/release -name '*.apk' | head -1) artifact/LuckyScreenHang-v1.4-exp-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LuckyScreenHang-v1.4-exp
          path: artifact/LuckyScreenHang-v1.4-exp-unsigned.apk
          retention-days: 7
