name: Build v1.4 experiment

on:
  push:
    branches: [v1.4-userservice]
    paths:
      - 'v14/**'
      - '.github/workflows/build-v14.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Normalize Android 17 SDK path
        run: |
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build test APK
        working-directory: v14
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifact
          cp $(find v14/app/build/outputs/apk/debug -name '*.apk' | head -1) \
            artifact/LuckyScreenHang-Android17-v1.4.5-test-ci.apk
          shasum -a 256 artifact/LuckyScreenHang-Android17-v1.4.5-test-ci.apk \
            > artifact/LuckyScreenHang-Android17-v1.4.5-test-ci.sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LuckyScreenHang-v1.4.5-test-ci
          path: artifact/*
          retention-days: 7
