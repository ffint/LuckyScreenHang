name: Build v1.4 experiment
on:
  push:
    branches: [v1.4-userservice]
    paths: ['v14/**', '.github/workflows/build-v14.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release
        working-directory: v14
        run: gradle :app:assembleRelease --stacktrace
      - name: Publish build as base64 for retrieval
        run: |
          APK=$(find v14/app/build/outputs/apk/release -name '*.apk' | head -1)
          base64 -w0 "$APK" > v14/LuckyScreenHang-v1.4-exp-unsigned.apk.b64
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v14/LuckyScreenHang-v1.4-exp-unsigned.apk.b64
          git commit -m 'Build v1.4 experimental APK [skip ci]'
          git push
