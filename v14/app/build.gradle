plugins { id 'com.android.application' }

android {
    namespace 'com.lucky.screenhang.v13'
    compileSdk 37

    defaultConfig {
        applicationId 'com.lucky.screenhang.v13'
        minSdk 29
        targetSdk 37
        versionCode 14
        versionName '1.4.4-exp'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    signingConfigs {
        test {
            storeFile file('../test-signing/lucky-test.keystore')
            storePassword 'luckytest'
            keyAlias 'luckytest'
            keyPassword 'luckytest'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            versionNameSuffix '-test'
            signingConfig signingConfigs.test
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
